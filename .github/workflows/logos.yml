name: store-logos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pillow
      - run: python -m tools.fetch_logos
      - name: সেভ
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/static/logos
          git diff --cached --quiet || git commit -m "স্টোরের লোগো"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
