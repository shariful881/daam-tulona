name: deploy-now
# দাম না তুলে শুধু বর্তমান ডাটা দিয়ে সাইট বানিয়ে সাথে সাথে প্রকাশ (ডিজাইন বদলের পর দ্রুত দেখতে)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "config/**", "data/manual_matches.json", "data/manual_prices.json", "data/report_status.json", ".github/workflows/deploy-now.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-now
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: সাইট বানানো
        env:
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || '/' }}
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || 'https://damtulona.com' }}
        run: |
          if [ "$BASE_URL" = "/" ]; then export BASE_URL=""; fi
          python -m web.build

      - name: বাজার আপডেটের ইনফোগ্রাফিক ছবি
        run: |
          pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium > /dev/null
          python -m tools.render_ig || echo "ছবি তৈরি হয়নি (পাতা ঠিক থাকবে)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # আপলোডের ঠিক পরপর GitHub অনেক সময় ফাইলটা দেখায় না ("No artifacts named github-pages") — একটু অপেক্ষা, ব্যর্থ হলে আবার চেষ্টা
      - name: আপলোডের পর অপেক্ষা
        run: sleep 30
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # সাইট বড় হয়েছে (প্রায় ৩০ হাজার পাতা), প্রকাশে বেশি সময় লাগতে পারে
      - name: প্রকাশ ব্যর্থ হলে অপেক্ষা
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
