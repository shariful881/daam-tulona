name: deploy-now
# দাম না তুলে শুধু বর্তমান ডাটা দিয়ে সাইট বানিয়ে সাথে সাথে প্রকাশ (ডিজাইন বদলের পর দ্রুত দেখতে)
on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-now
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: সাইট বানানো
        env:
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || format('/{0}', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          if [ "$BASE_URL" = "/" ]; then export BASE_URL=""; fi
          python -m web.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
