name: test-store
on:
  workflow_dispatch:
    inputs:
      store:
        required: true
      category:
        required: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tools.test_store ${{ inputs.store }} ${{ inputs.category }}
      - name: ফলাফল ও স্পেক probe-data ব্রাঞ্চে
        if: always()
        run: |
          mkdir -p probe && cp -r data/brand_specs probe/ 2>/dev/null || true
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          B="probe-${{ inputs.store }}"
          git checkout --orphan "$B"
          git rm -rq --cached .
          git add -f probe
          git commit -qm "test-store"
          git push -f origin "$B"
