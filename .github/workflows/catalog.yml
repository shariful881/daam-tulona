name: store-catalog
on: workflow_dispatch
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Star Tech ক্যাটাগরি গণনা
        run: python -m tools.startech_catalog
      - name: ফল সেভ
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog
          git diff --cached --quiet || git commit -m "Star Tech ক্যাটাগরি গণনা"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
