name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch store pages
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (compatible; DaamTulonaBot/1.0; +https://github.com/shariful881/daam-tulona)"
          get(){ curl -sSL -A "$UA" --max-time 40 -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAIL"; sleep 2; }
          get ei_ram.html https://www.eit.com.bd/computer-components/laptop-ram
          get ei_ram2.html "https://www.eit.com.bd/computer-components/laptop-ram?page=2"
          get ei_ssd.html https://www.eit.com.bd/computer-components/ssd
          get sb_ram.html https://smartbd.com/product-category/computer-components/ram/
          get sb_ssd.html https://smartbd.com/product-category/computer-components/ssd/
          get ph_ram2.html "https://www.pchouse.com.bd/laptop-ram?page=2"
          get ph_ssd.html https://www.pchouse.com.bd/internal-ssd
          get cr_ssd.html https://www.creatus.com.bd/ssd
      - name: Save
        run: |
          cd out && git init -q -b probe-data
          git -c user.name=bot -c user.email=bot@example.com add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
