name: probe-sites
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "স্পেস দিয়ে আলাদা করা URL"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m tools.probe ${{ inputs.urls }}
      - name: ফলাফল probe-data ব্রাঞ্চে
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe-data
          git rm -rq --cached .
          git add -f probe
          git commit -qm "probe"
          git push -f origin probe-data
