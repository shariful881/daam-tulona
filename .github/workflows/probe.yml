name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch store pages
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (compatible; DaamTulonaBot/1.0; +https://github.com/shariful881/daam-tulona)"
          get(){ curl -sSL -A "$UA" --max-time 40 -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAIL"; sleep 2; }
          for s in potakait.com:pk www.pchouse.com.bd:ph www.skyland.com.bd:sk www.computervillage.com.bd:cv www.globalbrand.com.bd:gb www.creatus.com.bd:cr www.onixbd.com:ox www.eit.com.bd:ei www.vibegaming.com.bd:vg www.smartbd.com:sb; do
            host=${s%%:*}; k=${s##*:}
            get ${k}_robots.txt https://$host/robots.txt
            get ${k}_home.html https://$host/
          done
          get pk_ram.html https://potakait.com/laptop-ram
          get ph_ram.html https://www.pchouse.com.bd/laptop-ram
          get sk_ram.html https://www.skyland.com.bd/laptop-ram
          get cr_ram.html https://www.creatus.com.bd/laptop-ram
          get ox_ram.html https://www.onixbd.com/laptop-ram
          get ei_ram.html https://www.eit.com.bd/laptop-ram
          get cv_ram.html https://www.computervillage.com.bd/laptop-ram
      - name: Save
        run: |
          cd out && git init -q -b probe-data
          git -c user.name=bot -c user.email=bot@example.com add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
