name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample pages
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          get(){ curl -sSL -A "$UA" --max-time 40 -o "out/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAIL"; }
          get st_cat.html "https://www.startech.com.bd/component/laptop-ram"
          get st_prod.html https://www.startech.com.bd/samsung-8gb-ddr4-3200mhz-laptop-ram
          get ut_cat.html "https://www.ultratech.com.bd/pc-components"
          get ut_robots.txt https://www.ultratech.com.bd/robots.txt
          get fs_cat.html "https://fourstarit.com.bd/c/laptop-ram"
          get fs_robots.txt https://fourstarit.com.bd/robots.txt
          get pcb_cat.html "https://pcbstore.com.bd/laptop/laptop-ram"
          get pcb_robots.txt https://pcbstore.com.bd/robots.txt
          for f in out/*; do echo "== $f"; head -c 300 "$f" | tr '\n' ' '; echo; done
      - name: Save samples to probe-data branch
        run: |
          cd out
          git init -q -b probe-data
          git -c user.name=bot -c user.email=bot@example.com add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
