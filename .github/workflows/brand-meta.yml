name: brand-meta
# ব্র্যান্ডের লোগো ও সোশ্যাল লিংক। প্রতি মাসের ১ তারিখ সকাল ১০:১১-এ পরীক্ষা: ভাঙা/না-থাকা লোগো ঠিক করার চেষ্টা, ফল অ্যাডমিনে
on:
  schedule:
    - cron: "11 4 1 * *"
  workflow_dispatch:
    inputs:
      brands:
        description: "--check (শুধু সমস্যাগুলো), --all (সব নতুন করে), বা নির্দিষ্ট ব্র্যান্ডের নাম"
        default: "--check"
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pillow
      - env:
          B: ${{ github.event.inputs.brands || '--check' }}
        run: python -m tools.fetch_brand_meta $B
      - name: সেভ
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/static/brands
          git diff --cached --quiet || git commit -m "ব্র্যান্ডের লোগো ও লিংক"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
