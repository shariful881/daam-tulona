name: daily-prices
on:
  schedule:
    - cron: "0 22 * * *"   # প্রতিদিন বাংলাদেশ সময় ভোর ৪:০০ (UTC রাত ১০টা); পুরো রান প্রায় ২.৫-৩ ঘণ্টা
  workflow_dispatch:
    inputs:
      stores:
        description: "শুধু এই স্টোরগুলো (কমা দিয়ে, যেমন ryans,techland); খালি = সব"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # অপেক্ষায় থাকা রানও সর্বশেষ ডাটা ও কোড নিয়ে বানাবে
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: প্রথম রান কিনা দেখা
        run: echo "SCRAPE=$([ '${{ github.event_name }}' != 'push' ] || [ ! -f data/offers.json ] && echo 1 || echo 0)" >> $GITHUB_ENV

      - name: স্টোর থেকে দাম তোলা
        if: env.SCRAPE == '1'
        env:
          ONLY_STORES: ${{ github.event.inputs.stores }}
        run: python -m scraper.run || echo "কিছু স্টোর ব্যর্থ — আগের ডাটা দিয়ে চলবে"

      - name: প্রোডাক্ট মেলানো ও ইতিহাস
        if: env.SCRAPE == '1'
        run: python -m matcher.match

      - name: ডাটা রিপোতে সেভ
        if: env.SCRAPE == '1'
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "দাম আপডেট $(TZ=Asia/Dhaka date +%F)"
          git pull --rebase -q || true
          git push

      - name: সাইট বানানো
        env:
          BASE_URL: ${{ vars.BASE_URL != '' && vars.BASE_URL || format('/{0}', github.event.repository.name) }}
          SITE_URL: ${{ vars.SITE_URL != '' && vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          if [ "$BASE_URL" = "/" ]; then export BASE_URL=""; fi
          python -m web.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # সাইট বড় হয়েছে (প্রায় ৩০ হাজার পাতা), প্রকাশে বেশি সময় লাগতে পারে

      - name: সার্চ ইঞ্জিনকে বদলানো পাতা জানানো (IndexNow)
        if: env.SCRAPE == '1'
        run: python -m tools.indexnow || true

      - name: Telegram চ্যানেলে আজকের দাম কমা (টোকেন সেট থাকলে)
        if: env.SCRAPE == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ vars.TELEGRAM_CHANNEL }}
        run: python tools/telegram_post.py dist/drops.json || echo "Telegram পোস্ট হয়নি (সাইটে প্রভাব নেই)"
