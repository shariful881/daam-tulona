name: probe-stores
on:
  push:
    branches: [probe-stores]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python tools/probe/probe_stores.py tools/probe/stores.txt
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: probe_result.json}
