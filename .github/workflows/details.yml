name: product-details
on:
  schedule:
    - cron: "41 3 * * *"   # প্রতিদিন বাংলাদেশ সময় সকাল ৯:৪১ (দামের রানের কয়েক ঘণ্টা পরে, যাতে স্টোর একটানা চাপ না পায়)
  workflow_dispatch:
    inputs:
      limit:
        description: "কতগুলো প্রোডাক্ট"
        default: "600"

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: স্পেক ও ওয়ারেন্টি সংগ্রহ
        env:
          ENRICH_LIMIT: ${{ github.event.inputs.limit || '600' }}
        run: python -m tools.enrich
      - name: সেভ
        run: |
          git config user.name "daam-tulona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/details
          git diff --cached --quiet || git commit -m "প্রোডাক্টের বিস্তারিত তথ্য $(TZ=Asia/Dhaka date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
