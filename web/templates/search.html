{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h1>খুঁজুন</h1>
    <input class="search" style="max-width:none;width:100%;font-size:1rem;padding:10px 14px" id="q" type="search" placeholder="যেমন: Samsung 8GB, Ryzen 5, 1TB SSD" aria-label="খুঁজুন" autofocus>
  </section>
  <section class="card"><div id="results" class="rows"></div><p class="muted" id="none" hidden style="margin:0">কিছু পাওয়া যায়নি।</p></section>
{% endblock %}
{% block after %}
<script src="{{ base }}/static/search.js?v={{ build_id }}"></script>
<script>
(function(){
  var q=document.getElementById('q'), out=document.getElementById('results'), none=document.getElementById('none'), seq=0;
  var base="{{ base }}";
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function taka(n){return '৳'+Number(n).toLocaleString('en-US')}
  function bn(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
  var t;
  function draw(){
    var v=q.value.trim(), my=++seq;
    if(!v){out.innerHTML='';none.hidden=true;return}
    out.classList.add('busy');
    DTSearch(v,{limit:60}).then(function(hits){
      if(my!==seq)return;
      out.classList.remove('busy');
      out.innerHTML=hits.map(function(d){return '<a class="row" href="'+base+'/p/'+encodeURIComponent(d.id)+'/"><div style="min-width:0"><div class="n">'+esc(d.n)+'</div><div class="w">'+esc(d.c)+(d.k>1?'<span class="badge">'+bn(d.k)+' স্টোর</span>':'')+'</div></div><div><div class="p">'+(d.p?taka(d.p):'—')+'</div></div></a>'}).join('');
      none.hidden=hits.length>0;
    });
    try{history.replaceState(null,'',location.pathname+'?q='+encodeURIComponent(v))}catch(e){}
  }
  var params=new URLSearchParams(location.search); if(params.get('q'))q.value=params.get('q');
  q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(draw,150)});
  draw();
})();
</script>
{% endblock %}
