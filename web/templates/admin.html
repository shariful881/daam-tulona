{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ base }}/static/admin.css?v={{ build_id }}">{% endblock %}
{% block content %}
  <div id="adm" data-repo="{{ repo }}" data-base="{{ base }}">
    <section class="card">
      <h1>অ্যাডমিন প্যানেল</h1>
      <p class="muted" style="margin:0;font-size:.88rem">সাইটের সব কিছু এখান থেকে নিয়ন্ত্রণ। এই পাতা Google-এ দেখাবে না। শেষ ডাটা: {{ updated }}</p>
      <div id="authbox"></div>
    </section>
    <nav class="atabs" id="tabs" role="tablist">
      <button role="tab" data-tab="dash" aria-selected="true">ড্যাশবোর্ড</button>
      <button role="tab" data-tab="stores">স্টোর</button>
      <button role="tab" data-tab="ads">বিজ্ঞাপন</button>
      <button role="tab" data-tab="sponsors">স্পন্সর</button>
      <button role="tab" data-tab="cats">ক্যাটাগরি</button>
      <button role="tab" data-tab="products">প্রোডাক্ট</button>
      <button role="tab" data-tab="settings">সেটিং</button>
    </nav>
    <div id="panel"><section class="card"><p class="muted" style="margin:0">লোড হচ্ছে…</p></section></div>
  </div>
  <div class="asave" id="savebar" hidden><div class="col"><span id="savemsg">সেভ না করা পরিবর্তন আছে</span><button type="button" class="btn sm" id="savebtn">সেভ করুন</button></div></div>
  <div class="atoast" id="toast" role="status"></div>
{% endblock %}
{% block after %}<script src="{{ base }}/static/admin.js?v={{ build_id }}" defer></script>{% endblock %}
